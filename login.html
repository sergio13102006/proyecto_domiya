<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login | Domiya</title>
  <link rel="stylesheet" href="login.css" />
  <script src="login.js" defer></script>
</head>
<body>
  <div class="login-page">
    <div class="login-box">
      <div class="brand">
        <img src="logodomiya.jpg" alt="Logo Domiya" class="logo" />
        <h1>DOMIYA</h1>
        <p>Control de domicilios para dueños</p>
      </div>

      <form id="loginForm" class="login-form">
        <div class="field">
          <label for="email">Correo</label>
          <input
            type="email"
            id="email"
            placeholder="dueno@domiya.com"
            autocomplete="email"
          />
        </div>

        <div class="field">
          <label for="password">Contraseña</label>
          <div class="password-wrap">
            <input
              type="password"
              id="password"
              placeholder="••••••••"
              autocomplete="current-password"
            />
            <button type="button" id="togglePassword">Ver</button>
          </div>
        </div>

        <button type="submit" class="btn-primary">Entrar</button>
        <button type="button" id="demoBtn" class="btn-secondary">Entrar a demo</button>

        <p id="message" class="message"></p>
      </form>
    </div>
  </div>
</body>
</html>
