<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login | Domiya</title>
  <meta name="theme-color" content="#0f172a" />
  <link rel="stylesheet" href="login.css" />
  <script src="login.js" defer></script>
</head>
<body>
  <main class="login-page">
    <section class="login-box">
      <div class="login-glow login-glow-1"></div>
      <div class="login-glow login-glow-2"></div>

      <div class="brand">
        <div class="logo-wrap">
          <img src="logodomiya.jpg" alt="Logo Domiya" class="logo" />
        </div>

        <span class="badge">Panel de propietarios</span>
        <h1>DOMIYA</h1>
        <p>Gestiona tus domicilios de forma rápida, clara y segura.</p>
      </div>

      <form id="loginForm" class="login-form" novalidate>
        <div class="field">
          <label for="email">Correo electrónico</label>
          <input
            type="email"
            id="email"
            name="email"
            placeholder="dueno@domiya.com"
            autocomplete="email"
            required
          />
        </div>

        <div class="field">
          <div class="label-row">
            <label for="password">Contraseña</label>
            <a href="#" class="link-muted">¿Olvidaste tu contraseña?</a>
          </div>

          <div class="password-wrap">
            <input
              type="password"
              id="password"
              name="password"
              placeholder="••••••••"
              autocomplete="current-password"
              required
            />
            <button
              type="button"
              id="togglePassword"
              class="toggle-password"
              aria-label="Mostrar contraseña"
            >
              Ver
            </button>
          </div>
        </div>

        <div class="actions">
          <button type="submit" class="btn btn-primary" id="submitBtn">
            <span class="btn-text">Entrar</span>
          </button>

          <button type="button" id="demoBtn" class="btn btn-secondary">
            Entrar a demo
          </button>
        </div>

        <p id="message" class="message" aria-live="polite"></p>
      </form>

      <div class="login-footer">
        <span>Acceso seguro</span>
        <span class="dot"></span>
        <span>Domiya</span>
      </div>
    </section>
  </main>
</body>
</html>
